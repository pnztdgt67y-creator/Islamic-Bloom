<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7f2">
<title>Islamic Bloom — Digital Jar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;600&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#fff8f1;
  --ivory:#fffdf9;
  --rose:#d98b97;
  --roseDeep:#b96f7a;
  --blush:#f9e4e7;
  --ink:#66534c;
  --muted:#9b8176;
  --gold:#c9a66b;
  --line:#ead8d2;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#fffaf6;
  color:var(--ink);
}

body{
  font-family:"Cormorant Garamond",Georgia,serif;
  background:
    radial-gradient(circle at 8% 2%,rgba(246,208,214,.62),transparent 27%),
    radial-gradient(circle at 96% 16%,rgba(244,229,203,.56),transparent 29%),
    linear-gradient(180deg,#fff7f2 0%,#fffdf9 100%);
}

button,a{
  font:inherit;
}

button{
  touch-action:manipulation;
}

.app{
  width:min(100%,480px);
  min-height:100dvh;
  margin:auto;
  padding:20px 18px 32px;
}

.hidden{
  display:none!important;
}

.brand{
  text-align:center;
  margin:8px 0 14px;
}

.brandline{
  font-size:12px;
  letter-spacing:4.5px;
  font-weight:700;
  color:var(--roseDeep);
}

.script{
  font-family:"Allura","Snell Roundhand","Segoe Script",cursive;
  color:var(--rose);
}

.title{
  font-size:62px;
  line-height:.93;
  margin:6px 0 2px;
}

.subtitle{
  font-size:15px;
  color:var(--muted);
  font-style:italic;
}

.shell{
  background:rgba(255,253,249,.96);
  border:1px solid var(--line);
  border-radius:32px;
  padding:17px;
  box-shadow:0 22px 60px rgba(146,93,102,.13);
}

.jar{
  width:min(92%,330px);
  height:545px;
  margin:0 auto 14px;
  position:relative;
  overflow:hidden;
  border:3px solid rgba(187,154,143,.28);
  border-top:15px solid var(--gold);
  border-radius:34px 34px 58px 58px;
  background:linear-gradient(
    180deg,
    rgba(255,255,255,.84),
    rgba(255,242,239,.82)
  );
  box-shadow:
    inset 16px 0 24px rgba(255,255,255,.62),
    0 15px 28px rgba(139,91,96,.09);
}

.jar:before{
  content:"";
  position:absolute;
  left:28px;
  top:18px;
  width:18px;
  height:220px;
  border-radius:20px;
  background:linear-gradient(
    180deg,
    rgba(255,255,255,.75),
    rgba(255,255,255,0)
  );
}

.jarLabel{
  position:absolute;
  z-index:5;
  top:34px;
  left:50%;
  transform:translateX(-50%);
  width:215px;
  padding:12px 12px 10px;
  border-radius:21px;
  background:rgba(255,251,248,.98);
  border:1px solid #eccfd2;
  text-align:center;
  box-shadow:0 5px 16px rgba(154,102,109,.07);
}

.jarLabel .script{
  font-size:40px;
  line-height:.9;
}

.jarLabel small{
  display:block;
  margin-top:5px;
  font-size:9px;
  letter-spacing:2px;
  color:var(--roseDeep);
  font-weight:700;
}

.grid{
  position:absolute;
  left:13px;
  right:13px;
  top:128px;
  bottom:36px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:8px 5px;
  align-items:center;
  justify-items:center;
}

.petal{
  width:63px;
  height:63px;
  border:0;
  background:transparent;
  padding:0;
  position:relative;
  cursor:pointer;
  transition:
    transform .14s ease,
    filter .2s ease,
    opacity .2s ease;
}

.petal:active{
  transform:scale(.92);
}

.petal svg{
  width:100%;
  height:100%;
}

.petalNumber{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:700;
  color:#a95f6b;
  text-shadow:0 1px #fff;
}

.petal.completed{
  filter:saturate(.7);
  opacity:.82;
}

.petal.completed .petalNumber{
  font-size:0;
}

.petal.completed .petalNumber:after{
  content:"✓";
  font-size:22px;
  color:#9b6e73;
  font-weight:700;
}

.hint{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  font-style:italic;
  margin:7px 0 2px;
}

.progress{
  text-align:center;
  margin-top:13px;
  color:var(--muted);
  font-size:13px;
}

.track{
  height:8px;
  border-radius:99px;
  overflow:hidden;
  background:#f3e2e2;
  margin-top:7px;
}

.fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#e8a1ac,#f0c6cb);
  transition:width .25s ease;
}

.garden{
  margin-top:14px;
  border-radius:22px;
  background:rgba(255,253,249,.9);
  border:1px solid var(--line);
  padding:12px;
  text-align:center;
}

.gardenTitle{
  font-size:32px;
  line-height:1;
}

#garden{
  font-size:25px;
  line-height:1.15;
  min-height:30px;
  word-break:break-word;
}

.resetBtn{
  width:100%;
  margin-top:11px;
  border-radius:18px;
  padding:12px 14px;
  background:#fffaf6;
  color:#9c7569;
  border:1px solid var(--line);
  cursor:pointer;
}

.toprow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:6px 0 10px;
}

.miniBack{
  border:1px solid var(--line);
  background:#fffaf7;
  color:#986f64;
  border-radius:999px;
  padding:9px 14px;
  cursor:pointer;
  font-size:14px;
}

.petalId{
  font-size:10px;
  letter-spacing:2px;
  color:var(--roseDeep);
  font-weight:700;
  text-align:center;
}

.today{
  text-align:center;
  font-size:58px;
  line-height:.94;
  margin:4px 0 14px;
}

.deedCard{
  border-radius:28px;
  background:linear-gradient(180deg,#fff8f8,#fae7e9);
  border:1px solid #eed0d4;
  padding:24px 19px;
  text-align:center;
  box-shadow:0 13px 28px rgba(164,105,112,.08);
}

.category{
  display:inline-block;
  border-radius:999px;
  padding:7px 13px;
  background:#fffdfb;
  border:1px solid #ecd2d4;
  color:var(--roseDeep);
  font-size:12px;
  font-weight:700;
}

.deed{
  font-size:27px;
  line-height:1.24;
  margin:16px 2px 3px;
}

.source{
  margin-top:13px;
  border-radius:26px;
  background:rgba(255,253,249,.97);
  border:1px solid var(--line);
  padding:18px 17px;
  text-align:center;
}

.sourceType{
  font-size:10px;
  letter-spacing:2px;
  font-weight:700;
  color:#9d7668;
  text-transform:uppercase;
}

.arabic{
  font-family:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  direction:rtl;
  font-size:28px;
  line-height:1.75;
  color:#5d4d47;
  margin:11px 0 7px;
}

.reflection{
  font-size:35px;
  line-height:1;
  margin-top:3px;
}

.meaning{
  font-size:17px;
  line-height:1.4;
  margin:7px 0 9px;
}

.reference{
  color:var(--roseDeep);
  font-weight:700;
  font-size:14px;
}

.mainBtn{
  width:100%;
  border:0;
  border-radius:20px;
  padding:14px 16px;
  background:linear-gradient(180deg,#e9a4ae,#d88794);
  color:white;
  font-size:17px;
  font-weight:600;
  margin-top:12px;
  cursor:pointer;
  box-shadow:0 7px 18px rgba(193,110,124,.22);
}

.backBtn{
  font-family:"Allura","Snell Roundhand","Segoe Script",cursive;
  font-size:35px;
  padding:12px 16px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(26px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);
  z-index:50;
  background:#6d5a53;
  color:#fff;
  padding:10px 15px;
  border-radius:999px;
  opacity:0;
  pointer-events:none;
  transition:.22s;
  font-size:13px;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:390px){
  .jar{
    height:510px;
  }

  .petal{
    width:57px;
    height:57px;
  }

  .title{
    font-size:56px;
  }

  .deed{
    font-size:25px;
  }

  .arabic{
    font-size:26px;
  }
}
</style>
</head>

<body>

<div class="app">

<main id="jarView">

<header class="brand">
  <div class="brandline">ISLAMIC BLOOM</div>
  <div class="script title">Digital Jar</div>
  <div class="subtitle">Pick a petal. Plant a little goodness.</div>
</header>

<section class="shell">

<div class="jar">

  <div class="jarLabel">
    <div class="script">Bloom</div>
    <small>ONE DEED AT A TIME</small>
  </div>

  <div class="grid" id="grid"></div>

</div>

<div class="hint">Choose any numbered flower 🌸</div>

<div class="progress">
  <span id="progressText">0 of 20 petals bloomed</span>

  <div class="track">
    <div class="fill" id="fill"></div>
  </div>
</div>

<button class="resetBtn" id="resetBtn" type="button">
Reset Garden
</button>

</section>

<section class="garden">

  <div class="script gardenTitle">My Garden</div>

  <div id="garden">♡</div>

</section>

</main>

<main id="deedView" class="hidden">

<div class="toprow">

  <button class="miniBack" id="miniBack" type="button">
  ← Jar
  </button>

  <div class="petalId" id="petalId">
  PETAL 01
  </div>

  <div style="width:58px"></div>

</div>

<div class="script today">
Today's Bloom
</div>

<section class="deedCard">

  <div class="category" id="category"></div>

  <div class="deed" id="deed"></div>

</section>

<section class="source">

  <div class="sourceType" id="sourceType"></div>

  <div class="arabic" id="arabic"></div>

  <div class="script reflection">
  Reflection
  </div>

  <div class="meaning" id="meaning"></div>

  <div class="reference" id="reference"></div>

</section>

<button class="mainBtn" id="doneBtn" type="button">
✓ I Bloomed This Petal
</button>

<button class="mainBtn backBtn" id="backBtn" type="button">
Back to Jar
</button>

</main>

</div>

<div class="toast" id="toast">
Saved 🌸
</div>

<script>
const PETALS=[

["Sadaqah",
"Give a little sadaqah today, even if the amount feels small.",
"Qur'an reminder",
"مَّثَلُ ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُمْ فِى سَبِيلِ ٱللَّهِ كَمَثَلِ حَبَّةٍ",
"Sincere spending for Allah is multiplied greatly.",
"Qur'an 2:261"],

["Goodness",
"Do one simple good deed quietly today.",
"Authentic hadith",
"كُلُّ مَعْرُوفٍ صَدَقَةٌ",
"Every act of goodness is charity.",
"Sahih Muslim 1005"],

["Dhikr",
"Say SubhanAllah slowly and mindfully today.",
"Authentic hadith",
"إِنَّ بِكُلِّ تَسْبِيحَةٍ صَدَقَةً",
"Every tasbih is charity.",
"Sahih Muslim 1006"],

["Dhikr",
"Say Alhamdulillah while thinking of one blessing Allah gave you.",
"Authentic hadith",
"وَكُلِّ تَحْمِيدَةٍ صَدَقَةٌ",
"Every tahmid is charity.",
"Sahih Muslim 1006"],

["Kind Speech",
"Say one genuinely kind sentence to someone today.",
"Authentic hadith",
"وَالْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ",
"A good word is charity.",
"Sahih al-Bukhari 2891"],

["Parents",
"Do one thoughtful thing for your mother or father today.",
"Qur'an reminder",
"وَبِٱلْوَٰلِدَيْنِ إِحْسَـٰنًا",
"Allah commands excellent treatment of parents.",
"Qur'an 17:23"],

["Parents",
"Speak to your parents with extra softness today.",
"Qur'an reminder",
"وَقُل لَّهُمَا قَوْلًا كَرِيمًا",
"Speak to them graciously.",
"Qur'an 17:23"],

["Gratitude",
"Name three blessings you are genuinely grateful for.",
"Qur'an reminder",
"لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ",
"Allah promises increase for gratitude.",
"Qur'an 14:7"],

["Character",
"When something annoys you today, pause before reacting.",
"Qur'an reminder",
"وَٱلْكَٰظِمِينَ ٱلْغَيْظَ",
"Allah praises those who restrain anger.",
"Qur'an 3:134"],

["Forgiveness",
"Let go of one small grievance instead of replaying it.",
"Qur'an reminder",
"وَٱلْعَافِينَ عَنِ ٱلنَّاسِ",
"Allah praises those who pardon others.",
"Qur'an 3:134"],

["Generosity",
"Give something useful today: money, food, time, or help.",
"Qur'an reminder",
"ٱلَّذِينَ يُنفِقُونَ فِى ٱلسَّرَّآءِ وَٱلضَّرَّآءِ",
"Allah praises those who give in ease and hardship.",
"Qur'an 3:134"],

["Peace",
"Take one gentle step toward repairing a tension.",
"Qur'an reminder",
"فَأَصْلِحُوا۟ بَيْنَ أَخَوَيْكُمْ",
"Make peace between one another.",
"Qur'an 49:10"],

["Family",
"Help someone at home before they ask.",
"Authentic hadith",
"كَانَ يَكُونُ فِي مِهْنَةِ أَهْلِهِ",
"The Prophet ﷺ used to help his family at home.",
"Sahih al-Bukhari 676"],

["Helping",
"Make something easier for someone today.",
"Authentic hadith",
"يُعِينُ الرَّجُلَ فِي دَابَّتِهِ ... صَدَقَةٌ",
"Helping another person is charity.",
"Sahih al-Bukhari 2891"],

["Sadaqah",
"Give charity today without reminding anyone of what you gave.",
"Qur'an reminder",
"لَا تُبْطِلُوا۟ صَدَقَٰتِكُم بِٱلْمَنِّ وَٱلْأَذَىٰ",
"Protect your charity from reminders and hurt.",
"Qur'an 2:264"],

["Community",
"Remove or fix one small thing that could inconvenience or harm others.",
"Authentic hadith",
"اعْزِلِ الأَذَى عَنْ طَرِيقِ الْمُسْلِمِينَ",
"Remove harmful things from people's path.",
"Sahih Muslim 2618a"],

["Dhikr",
"Say Allahu Akbar with presence and meaning today.",
"Authentic hadith",
"وَكُلِّ تَكْبِيرَةٍ صَدَقَةٌ",
"Every takbir is charity.",
"Sahih Muslim 1006"],

["Kind Speech",
"Replace one complaint today with a kinder sentence.",
"Qur'an reminder",
"وَقُولُوا۟ لِلنَّاسِ حُسْنًا",
"Speak beautifully to people.",
"Qur'an 2:83"],

["Gratitude",
"Thank Allah for one ordinary blessing you usually overlook.",
"Qur'an reminder",
"لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ",
"Allah promises increase for gratitude.",
"Qur'an 14:7"],

["Guidance",
"Help someone understand something or find their way today.",
"Authentic hadith",
"وَدَلُّ الطَّرِيقِ صَدَقَةٌ",
"Guiding someone is charity.",
"Sahih al-Bukhari 2891"]

];

const COLORS=[
["#ebb0b9","#f5d4d8"],
["#f1c3ca","#f8e1e4"],
["#f2d0bf","#f9e4d7"],
["#e8b8c4","#f4d8de"]
];

const $=id=>document.getElementById(id);

const grid=$("grid");
const jarView=$("jarView");
const deedView=$("deedView");
const toast=$("toast");

let current=0;
let completed=[];

try{
  completed=
  JSON.parse(
    localStorage.getItem("ibCompleted") || "[]"
  );
}catch(e){
  completed=[];
}

function flowerSvg(i){

const c=COLORS[i%COLORS.length];

return `
<svg viewBox="0 0 100 100">

<g
fill="${c[0]}"
stroke="${c[1]}"
stroke-width="1.2">

<ellipse
cx="50"
cy="20"
rx="16"
ry="27"/>

<ellipse
cx="77"
cy="36"
rx="16"
ry="27"
transform="rotate(60 77 36)"/>

<ellipse
cx="77"
cy="66"
rx="16"
ry="27"
transform="rotate(120 77 66)"/>

<ellipse
cx="50"
cy="80"
rx="16"
ry="27"/>

<ellipse
cx="23"
cy="66"
rx="16"
ry="27"
transform="rotate(60 23 66)"/>

<ellipse
cx="23"
cy="36"
rx="16"
ry="27"
transform="rotate(120 23 36)"/>

</g>

<circle
cx="50"
cy="50"
r="22"
fill="#fffaf5"
stroke="#d3b176"
stroke-width="1.5"/>

</svg>
`;

}

function buildFlowers(){

grid.innerHTML="";

PETALS.forEach((p,i)=>{

const button=
document.createElement("button");

button.type="button";

button.className=
"petal"+
(completed.includes(i)
 ? " completed"
 : "");

button.innerHTML=
flowerSvg(i)+
`<span class="petalNumber">${i+1}</span>`;

button.onclick=
()=>openPetal(i);

grid.appendChild(button);

});

}

function openPetal(i){

current=i;

const p=PETALS[i];

$("petalId").textContent=
`PETAL ${String(i+1).padStart(2,"0")} • ${p[0].toUpperCase()}`;

$("category").textContent=p[0];
$("deed").textContent=p[1];
$("sourceType").textContent=p[2];
$("arabic").textContent=p[3];
$("meaning").textContent=p[4];
$("reference").textContent=p[5];

jarView.classList.add("hidden");

deedView.classList.remove("hidden");

window.scrollTo({
  top:0,
  behavior:"instant"
});

}

function back(){

deedView.classList.add("hidden");

jarView.classList.remove("hidden");

window.scrollTo({
  top:0,
  behavior:"instant"
});

}

function update(){

const n=completed.length;

$("progressText").textContent=
`${n} of ${PETALS.length} petals bloomed`;

$("fill").style.width=
`${(n/PETALS.length)*100}%`;

const icons=
["🌸","🌷","🌼","🌺"];

$("garden").textContent=
n
? Array.from(
    {length:n},
    (_,i)=>icons[i%icons.length]
  ).join("")
: "♡";

buildFlowers();

}

function showToast(message){

toast.textContent=message;

toast.classList.add("show");

setTimeout(()=>{
  toast.classList.remove("show");
},1700);

}

$("doneBtn").onclick=()=>{

const btn=$("doneBtn");

if(!completed.includes(current)){

  completed.push(current);

  localStorage.setItem(
    "ibCompleted",
    JSON.stringify(completed)
  );

  update();

  btn.textContent=
  "🌸 Petal Bloomed!";

  showToast(
    "Added to your garden 🌸"
  );

  setTimeout(()=>{

    btn.textContent=
    "✓ I Bloomed This Petal";

    back();

  },1100);

}else{

  btn.textContent=
  "🌷 Already Bloomed";

  showToast(
    "This petal is already blooming"
  );

  setTimeout(()=>{

    btn.textContent=
    "✓ I Bloomed This Petal";

    back();

  },900);

}

};

$("backBtn").onclick=back;

$("miniBack").onclick=back;

$("resetBtn").onclick=()=>{

if(
  confirm(
    "Reset your completed petals and start a fresh garden?"
  )
){

completed=[];

localStorage.removeItem(
  "ibCompleted"
);

update();

showToast(
  "Fresh garden started 🌱"
);

}

};

update();

</script>

</body>
</html>
